spring.application.name=engine

# Database Connection Settings (PostgreSQL when env set, H2 in-memory local fallback)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:koncertify;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# JPA Dialect & Schema Properties
spring.jpa.database-platform=${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false

# Redis Connection Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# Prevent Redis connection check from crashing the engine on start
spring.data.redis.repositories.enabled=false
# Keep the connection pool from hanging indefinitely if Redis is down
spring.data.redis.timeout=2000ms

management.endpoints.web.exposure.include=health,info
server.port=${PORT:10000}
    
# Force Actuator endpoints to return the required CORS authorization headers
management.endpoints.web.cors.allowed-origins=https://koncert-ify.vercel.app
management.endpoints.web.cors.allowed-methods=GET,OPTIONS

# Speed up startup by initializing database connections lazily as needed
spring.datasource.hikari.initialization-fail-timeout=-1

# Temporarily disable lazy initialization so Hibernate can update your schema
spring.datasource.lazy-initialization=false

# High concurrency Hikari pool configuration
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.leak-detection-threshold=10000